name: minierp-dev
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: [CMD-SHELL, 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: minierp-api:dev
    command: [--migrate, --seed]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Erp: Server=sql;Database=MiniErp;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Auth__SigningKey: ${ERP_SIGNING_KEY:?Set ERP_SIGNING_KEY to a Base64 key of at least 32 bytes}
      Auth__PublicOrigin: ${ERP_PUBLIC_ORIGIN:-http://localhost:5186}
      Seed__AdminEmail: ${ERP_ADMIN_EMAIL:?Set ERP_ADMIN_EMAIL}
      Seed__AdminPassword: ${ERP_ADMIN_PASSWORD:?Set ERP_ADMIN_PASSWORD}
    depends_on:
      sql:
        condition: service_healthy
    restart: 'no'
  provision:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: [/bin/bash, /provision-runtime.sh]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}
      ERP_DB_PASSWORD: ${ERP_DB_PASSWORD:?Set ERP_DB_PASSWORD}
    volumes:
      - ./deploy/provision-runtime.sh:/provision-runtime.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'
  api:
    image: minierp-api:dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Erp: Server=sql;Database=MiniErp;User Id=minierp_app;Password=${ERP_DB_PASSWORD:?Set ERP_DB_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Auth__SigningKey: ${ERP_SIGNING_KEY:?Set ERP_SIGNING_KEY}
      Auth__PublicOrigin: ${ERP_PUBLIC_ORIGIN:-http://localhost:5186}
      Orders__ApprovalThresholdVnd: ${ERP_APPROVAL_THRESHOLD_VND:-}
    depends_on:
      provision:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /bin/bash, -ec, 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; head -n 1 <&3 | grep -q " 200 "']
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - 127.0.0.1:${ERP_WEB_PORT:-5186}:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://127.0.0.1:8080/health/ready']
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  sql-data:
